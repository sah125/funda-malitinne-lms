{% if t.eligibility_status == 'eligible' %}<span class="pill ok"><i class="fas fa-check"></i> Eligible</span>{% elif t.eligibility_status == 'missing_docs' %}<span class="pill warn"><i class="fas fa-file-circle-exclamation"></i> Documents needed</span>{% elif t.eligibility_status == 'not_eligible' %}<span class="pill bad"><i class="fas fa-ban"></i> Not eligible</span>{% else %}<span class="pill"><i class="fas fa-question"></i> Check manually</span>{% endif %}
