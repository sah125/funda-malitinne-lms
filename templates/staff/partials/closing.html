{% if t.closing_date %}{% with d=t.days_until_close %}<div class="num" style="font-weight:600;color:var(--ink)">{{ t.closing_date|date:"j M Y" }}</div><div style="font-size:12.5px" class="{% if d < 0 %}faint{% elif d <= 7 %}state-expired{% elif d <= 14 %}state-expiring{% else %}muted{% endif %}">{% if d < 0 %}Closed{% elif d == 0 %}Closes today{% elif d == 1 %}Tomorrow{% else %}{{ d }} days left{% endif %}</div>{% endwith %}{% else %}<span class="muted">Not announced</span>{% endif %}
