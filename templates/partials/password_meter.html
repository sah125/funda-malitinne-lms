<script>
(function () {
    var input = document.getElementById('password'), bar = document.getElementById('pwMeter');
    if (!input || !bar) return;
    input.addEventListener('input', function () {
        var v = input.value, score = 0;
        if (v.length >= 10) score++; if (v.length >= 14) score++;
        if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++; if (/\d/.test(v)) score++; if (/[^A-Za-z0-9]/.test(v)) score++;
        var colours = ['#c0392b', '#d35400', '#d68910', '#9f7734', '#2e8b57', '#2e8b57'];
        bar.style.width = Math.max(8, score * 20) + '%'; bar.style.background = colours[score];
    });
})();
</script>
