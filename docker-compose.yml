version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: funda_malitinne_db
    environment:
      POSTGRES_DB: funda_malitinne_lms
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: secure-password-change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: funda_malitinne_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  # Django Application
  web:
    build: .
    container_name: funda_malitinne_web
    command: >
      sh -c "
      python manage.py migrate --settings=lms.settings_production &&
      gunicorn --config gunicorn_config.py lms.wsgi:application
      "
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms_network
    restart: unless-stopped

  # Celery Worker
  celery:
    build: .
    container_name: funda_malitinne_celery
    command: celery -A lms worker -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - logs_volume:/app/logs
    networks:
      - lms_network
    restart: unless-stopped

  # Celery Beat Scheduler
  celery_beat:
    build: .
    container_name: funda_malitinne_celery_beat
    command: celery -A lms beat -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - logs_volume:/app/logs
    networks:
      - lms_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: funda_malitinne_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - lms_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  lms_network:
    driver: bridge
