name: Django Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: malitinne_test
          POSTGRES_USER: malitinne
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc libpq-dev libcairo2-dev pkg-config python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test environment file
        run: |
          cat > .env << 'EOF'
          DEBUG=True
          SECRET_KEY=test-secret-key-for-ci-only-not-production
          DATABASE_URL=postgresql://malitinne:testpassword123@localhost:5432/malitinne_test
          ALLOWED_HOSTS=localhost,127.0.0.1
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          EOF

      - name: Run database migrations
        run: |
          python manage.py migrate --noinput
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: postgresql://malitinne:testpassword123@localhost:5432/malitinne_test
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1

      - name: Run tests
        run: |
          python manage.py test --verbosity=2
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: postgresql://malitinne:testpassword123@localhost:5432/malitinne_test
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1

      - name: Check for missing migrations
        run: |
          python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: postgresql://malitinne:testpassword123@localhost:5432/malitinne_test
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1
