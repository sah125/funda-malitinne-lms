name: Django Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Run migrations
      env:
        DEBUG: 'True'
        DATABASES_DEFAULT_ENGINE: django.db.backends.postgresql
        DATABASES_DEFAULT_NAME: test_db
        DATABASES_DEFAULT_USER: test_user
        DATABASES_DEFAULT_PASSWORD: test_password
        DATABASES_DEFAULT_HOST: localhost
        DATABASES_DEFAULT_PORT: 5432
      run: |
        python manage.py migrate
    
    - name: Run tests
      env:
        DEBUG: 'True'
        DATABASES_DEFAULT_ENGINE: django.db.backends.postgresql
        DATABASES_DEFAULT_NAME: test_db
        DATABASES_DEFAULT_USER: test_user
        DATABASES_DEFAULT_PASSWORD: test_password
        DATABASES_DEFAULT_HOST: localhost
        DATABASES_DEFAULT_PORT: 5432
      run: |
        python manage.py test
    
    - name: Generate coverage report
      run: |
        pip install coverage
        coverage run --source='.' manage.py test
        coverage xml
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
      continue-on-error: true
